vars:
  TOOLS_FOLDER: /opt
  OUTPUT_FOLDER: /output/workflow
  SCOPE_FILE: /opt/scope-scraper/data/scopes/all_scope_domains_new.txt
  POSTMAN_KEY: {{POSTMAN_KEY}}
  HUNTER_FOLDER: /home/vps/Tools/hunter3

parallel: false
modules:

    - name: dir_creation
      cmds: 
      - mkdir -p {{OUTPUT_FOLDER}} && mkdir -p {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)
      - xargs -r -I{} mkdir -p {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/{}
    
    - name: postevil
      cmds:
      - xargs -r -I{} postevil -d {} -k {{POSTMAN_KEY}} --tokens -o {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/{} < {{SCOPE_FILE}}

    - name: iacrawl
      cmds:
      - xargs -r -I{} iacrawl scan -d {} -o {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/{}/iacrawl.json < {{SCOPE_FILE}}

    - name: s3scan
      cmds:
      - xargs -r -I{} s3scan -d {} -o {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/{}/s3scan.md < {{SCOPE_FILE}}

    - name: blh
      cmds:
      - xargs -r -I{} blh-hunter -d {} -o {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/{}/blh-hunter.json < {{SCOPE_FILE}}

    - name: dnsdangling
      cmds:
      - xargs -r -I{} python3 /opt/dnsdangling/dnsdangle_exploit.py {} -o {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/{}/dnsdangling.json < {{SCOPE_FILE}}

    - name: subdomain_enum
      cmds:
      - mkdir -p {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/subfinder
      - subfinder -dL {{SCOPE_FILE}} -silent -o {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/subfinder/subdomains.txt
      - cat {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/subfinder/subdomains.txt | httpx -silent -o {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/subfinder/active_subdomains.txt
      - cat {{SCOPE_FILE}} | anew {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/subfinder/active_subdomains.txt

    - name: no_skills_test
      cmds:
      - xargs -r -I{} /opt/hunter4/bin/hunter4 hunt {} --out {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/{}/hunter4 --authorized < {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/subfinder/active_subdomains.txt

    - name: skills_test
      cmds:
      - xargs -r -I{} /opt/hunter5/bin/hunter5 hunt {} --out {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/{}/hunter5 --authorized < {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/subfinder/active_subdomains.txt

    - name: files_triager
      cmds:
      - xargs -r -I{} /opt/hunter6/bin/hunter6 triage {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/{} --authorized --in-scope {} < {{OUTPUT_FOLDER}}/$(date +%Y-%m-%d)/subfinder/active_subdomains.txt






